# agenttree 项目配置 —— QQbot
#
# 三条和默认模板不一样的地方（默认模板在这个项目上会跑不起来）：
#   1. act 必须用 cli worker（opencode）；shell worker 需要 payload.command，brain 生成的节点没有
#   2. base_branch 必须等于当前分支，否则 run 会切回 main 把改动合到主分支
#   3. 测试命令是 `npm run check-all`（node --test），不是 jest 的 --runInBand

[project]
name = "QQbot"
type = "node"
workdir = "."

[brain]
worker = "brain-llm"
max_depth = 4
max_children = 6
attempts = 2
cache = true
notes = """
语言：TypeScript，Node 24 原生 type-stripping 直接跑 .ts。
禁止用 enum / namespace / 构造函数参数属性（类型剥离不支持）。
测试命令：npm run check-all（15 项全量检查）；只跑单测用 npm test。
不引入新运行时依赖（现有仅 ws / yaml）。
注释和文档用中文。数据文件都在 persona/ 和 data/ 下，已在 .gitignore 里，节点不要动它们。
"""

[[workers]]
name = "brain-llm"
kind = "llm"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
concurrency = 2
timeout = 300
json_mode = true
temperature = 0.2

[[workers]]
name = "opencode"
kind = "cli"
cmd = [
  "C:\\Users\\Lenovo\\AppData\\Local\\Programs\\@opencodedesktop\\resources\\opencode-cli.exe",
  "run", "--standalone", "--auto", "--format", "json",
  "-m", "opencode/deepseek-v4.1-flash-free", "{spec}",
]
concurrency = 1
timeout = 1200

[route]
plan  = ["brain-llm"]
think = ["brain-llm"]
act   = ["opencode"]

[git]
# 必须和当前分支一致，否则 run 会切走
base_branch = "bugfix/r1-emoji-vision"
worktree_dir = ".agenttree/wt"
auto_merge = true
auto_commit = true

[limits]
max_cost_usd = 5.0
node_timeout_sec = 1200
max_attempts = 2

[checks]
# 只做轻量预检：全量检查放到每个节点的判据里，别在 preflight 跑 15 项
preflight = ["cmd:node --version"]
