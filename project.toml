# agenttree 项目配置 —— QQbot
#
# 三条和默认模板不一样的地方（默认模板在这个项目上会跑不起来）：
#   1. act 必须用 cli worker（opencode）；shell worker 需要 payload.command，brain 生成的节点没有
#   2. base_branch 必须等于当前分支，否则 run 会切回 main 把改动合到主分支
#   3. 测试命令是 `npm run check-all`（node --test），不是 jest 的 --runInBand

[project]
name = "QQbot"
type = "node"
workdir = "."

[brain]
worker = "brain-llm"
max_depth = 4
max_children = 6
attempts = 2
cache = true
notes = """
语言：TypeScript，Node 24 原生 type-stripping 直接跑 .ts。
禁止用 enum / namespace / 构造函数参数属性（类型剥离不支持）。
测试命令：npm run check-all（15 项全量检查）；只跑单测用 npm test。
不引入新运行时依赖（现有仅 ws / yaml）。
注释和文档用中文。数据文件都在 persona/ 和 data/ 下，已在 .gitignore 里，节点不要动它们。
"""

[[workers]]
name = "brain-llm"
kind = "llm"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
concurrency = 2
timeout = 300
json_mode = true
temperature = 0.2

# act 执行器：**opencode 优先，不行再用 dsh headless**。
#
# 为什么不直接写 route.act = ["opencode", "dsh"]：
#   agenttree 的 worker_for() 只检查「配置里有没有这个 worker」，
#   不检查「这个 worker 还能不能用」——只要配了就直接用，不会 fallback。
#   所以用一个包装脚本 scripts/act-fallback.mjs 在进程内部做回退。
#
# opencode 现在挂的原因（2026-10-26 实测）：
#   {"type":"provider.quota","message":"Free usage limit reached...","status":429}
# 是免费额度用完，不是 exe 坏了。订阅或额度恢复后它又能用，所以保留。
#
# 为什么用 node 而不是 dsh.cmd：
#   agenttree 用 subprocess(shell=False) 调 worker，Windows 的 CreateProcess
#   只认 .exe，不认 .cmd/.bat。node 是 .exe，所以用它当入口。
#
# 为什么要注释掉 .env 里的 DEEPSEEK_BASE_URL：
#   dsh 拒绝 .env 里设这个变量（只认启动环境）。代码里有默认值，
#   注释掉不影响 bot，也能让 probe 在项目根目录跑通。
[[workers]]
name = "act"
kind = "cli"
cmd = ["node", "scripts/act-fallback.mjs", "{spec}"]
concurrency = 1
timeout = 1200

# 保留 dsh 的定义，方便单独 probe（ACT_FORCE=dsh 时也走它）
[[workers]]
name = "dsh"
kind = "cli"
cmd = [
  "node",
  "C:\\Users\\Lenovo\\AppData\\Local\\npm-global\\node_modules\\@deepseek-ai\\dsh\\lib\\bin.js",
  "--profile", "headless",
  "{spec}",
]
concurrency = 1
timeout = 1200

# 注意：**不单独定义 opencode worker**。
# 它现在由 act-fallback.mjs 内部调用（先试 opencode，失败了再换 dsh）。
# 如果在这里也定义，probe 会因为它额度用完而报 FAIL，让整个 probe 退出码变 1，
# 看起来像配置错了 —— 实际上 act 通道是好的。

[route]
plan  = ["brain-llm"]
think = ["brain-llm"]
act   = ["act"]

[git]
# 必须和当前分支一致，否则 run 会切走
base_branch = "bugfix/r1-emoji-vision"
worktree_dir = ".agenttree/wt"
auto_merge = true
auto_commit = true

[limits]
max_cost_usd = 5.0
node_timeout_sec = 1200
max_attempts = 2

[checks]
# 只做轻量预检：全量检查放到每个节点的判据里，别在 preflight 跑 15 项
preflight = ["cmd:node --version"]
